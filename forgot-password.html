<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Forgot Password — Xantex Global Markets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #e60023;
      --blue:   #1a5cff;
      --blue-dk:#1244cc;
      --bg:     #f4f6f9;
      --white:  #ffffff;
      --text:   #111111;
      --muted:  #666666;
      --border: #e0e3e8;
      --green:  #22a06b;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; overflow-x:clip; }
    body { font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); font-size:15px; min-height:100vh; }
    img { display:block; max-width:100%; }
    a { text-decoration:none; color:inherit; }
    button { font-family:inherit; cursor:pointer; }

    .navbar {
      background:#fff; border-bottom:1px solid var(--border);
      height:64px; display:flex; align-items:center; padding:0 clamp(16px,4vw,60px);
      position:sticky; top:0; z-index:100;
    }
    .navbar__inner { width:100%; max-width:1240px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
    .navbar__logo img  { height:130px; width:auto; }
    .navbar__logo-text { font-size:24px; font-weight:700; color:var(--red); display:none; }
    .navbar__back { font-size:13px; color:var(--blue); font-weight:500; display:flex; align-items:center; gap:5px; }
    .navbar__back:hover { text-decoration:underline; }

    .page {
      min-height:calc(100vh - 64px);
      display:flex; align-items:center; justify-content:center;
      padding:40px 20px;
    }

    .card {
      background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:40px 44px; width:100%; max-width:440px;
      box-shadow:0 4px 24px rgba(0,0,0,0.06);
    }

    .card__icon {
      width:52px; height:52px; border-radius:14px;
      background:var(--blue); display:flex; align-items:center; justify-content:center;
      margin-bottom:20px;
    }
    .card__icon svg { width:24px; height:24px; fill:none; stroke:#fff; stroke-width:2; }

    .card__title { font-size:22px; font-weight:700; letter-spacing:-0.3px; margin-bottom:6px; }
    .card__sub   { font-size:13px; color:var(--muted); margin-bottom:28px; line-height:1.6; }

    .field { display:flex; flex-direction:column; gap:5px; margin-bottom:16px; }
    .field label { font-size:13px; font-weight:500; }
    .field input {
      height:48px; border:1.5px solid var(--border); border-radius:8px;
      padding:0 14px; font-size:14px; font-family:inherit; color:var(--text);
      background:#fff; outline:none; transition:border-color .15s, box-shadow .15s;
    }
    .field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(26,92,255,.1); }
    .field input.error { border-color:var(--red); }

    .btn-submit {
      width:100%; height:50px; background:var(--blue); color:#fff;
      border:none; border-radius:28px; font-size:15px; font-weight:600;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:background .15s; margin-top:4px;
    }
    .btn-submit:hover { background:var(--blue-dk); }
    .btn-submit:disabled { opacity:0.65; pointer-events:none; }

    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner {
      width:18px; height:18px; border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none;
    }
    .btn-submit.loading .btn-label { display:none; }
    .btn-submit.loading .spinner   { display:block; }

    .alert {
      display:none; padding:12px 14px; border-radius:8px;
      font-size:13px; gap:10px; align-items:flex-start; margin-bottom:16px;
    }
    .alert.error   { background:#fff0f0; border:1px solid #fbc5c5; color:#a32d2d; display:flex; }
    .alert.success { background:#e6f7ef; border:1px solid #b3e8d0; color:#1a6644; display:flex; }
    .alert svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; flex-shrink:0; margin-top:1px; }

    .back-link { text-align:center; font-size:13px; color:var(--muted); margin-top:20px; }
    .back-link a { color:var(--blue); font-weight:500; }
    .back-link a:hover { text-decoration:underline; }

    @media (max-width:480px) { .card { padding:32px 24px; } }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <meta name="theme-color" content="#1a5cff">
</head>
<body>

<nav class="navbar">
  <div class="navbar__inner">
    <div class="navbar__logo">
      <a href="/index.html">
        <img src="/images/logo.png" alt="Xantex"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="navbar__logo-text">Xantex</span>
      </a>
    </div>
    <a href="login.html" class="navbar__back">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Login
    </a>
  </div>
</nav>

<div class="page">
  <div class="card">

    <div class="card__icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>

    <div class="card__title">Reset your password</div>
    <div class="card__sub">Enter your account email and we'll send you a link to reset your password.</div>

    <div class="alert" id="alert">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="alert-msg"></span>
    </div>

    <div id="form-wrap">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
      </div>

      <button class="btn-submit" id="btn-send" onclick="sendReset()">
        <span class="btn-label">Send Reset Link</span>
        <div class="spinner"></div>
      </button>
    </div>

    <div class="back-link">Remember your password? <a href="login.html">Sign in</a></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script>
  async function sendReset() {
    const emailEl = document.getElementById('email');
    const btn     = document.getElementById('btn-send');
    const alertEl = document.getElementById('alert');
    const db      = window.XANTEX_DB;

    alertEl.className = 'alert';
    emailEl.classList.remove('error');

    const email = emailEl.value.trim();
    if (!email || !/\S+@\S+\.\S+/.test(email)) {
      emailEl.classList.add('error');
      alertEl.className = 'alert error';
      document.getElementById('alert-msg').textContent = 'Please enter a valid email address.';
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });

    btn.classList.remove('loading');
    btn.disabled = false;

    if (error) {
      alertEl.className = 'alert error';
      document.getElementById('alert-msg').textContent = error.message || 'Failed to send reset email. Please try again.';
      return;
    }

    // Notify admin of password reset request
    fetch('https://ywnpzjjpighjhhqoxtsj.supabase.co/functions/v1/notify-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-notify-key': 'xantex-notify-2026' },
      body: JSON.stringify({ type: 'password_reset', email }),
    }).catch(() => {});
    // Success — hide form, show confirmation
    document.getElementById('form-wrap').style.display = 'none';
    alertEl.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>Reset link sent to <strong>${email}</strong>. Check your inbox and follow the link to set a new password. You can close this page.</span>`;
    alertEl.className = 'alert success';
  }

  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendReset();
  });
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
</html>
