<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Transaction History — Xantex Global Markets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       TOKENS
    ============================================================ */
    :root {
      --red:      #e60023;
      --blue:     #1a5cff;
      --blue-dk:  #1244cc;
      --blue-lt:  #e8eeff;
      --green:    #22a06b;
      --green-lt: #e6f7ef;
      --orange:   #f5a623;
      --bg:       #f4f6f9;
      --white:    #ffffff;
      --text:     #111111;
      --muted:    #666666;
      --border:   #e0e3e8;
      --sidebar-w: 240px;
      --topbar-h:  64px;
    }

    /* ============================================================
       RESET
    ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.6; }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    ul { list-style: none; }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .layout { display: flex; min-height: 100vh; }

    /* ============================================================
       SIDEBAR
    ============================================================ */
    .sidebar {
      width: var(--sidebar-w);
      background: #0d1120;
      color: #fff;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 200;
      transition: transform 0.25s ease;
    }
    .sidebar__logo {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .sidebar__logo img  { height: 130px; width: auto; }
    .sidebar__logo-text { font-size: 22px; font-weight: 700; color: var(--red); }
    .sidebar__nav { flex: 1; overflow-y: auto; padding: 12px 0; }
    .sidebar__section-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.3);
      padding: 16px 20px 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px; font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.6); border-radius: 0;
      transition: background 0.15s, color 0.15s;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left;
    }
    .nav-item:hover  { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-item.active { background: rgba(26,92,255,0.18); color: #fff; border-left: 3px solid var(--blue); }
    .nav-item svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }
    .sidebar__footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar__avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue); display: flex; align-items: center;
      justify-content: center; font-size: 13px; font-weight: 700;
      color: #fff; flex-shrink: 0;
    }
    .sidebar__user-name  { font-size: 13px; font-weight: 600; color: #fff; }
    .sidebar__user-role  { font-size: 11px; color: rgba(255,255,255,0.4); }
    .sidebar__logout {
      margin-left: auto; background: none; border: none;
      color: rgba(255,255,255,0.4); padding: 4px;
    }
    .sidebar__logout:hover { color: var(--red); }
    .sidebar__logout svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* ============================================================
       MAIN
    ============================================================ */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-width: 0;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ============================================================
       TOPBAR
    ============================================================ */
    .topbar {
      height: var(--topbar-h);
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar__hamburger {
      display: none; background: none; border: none;
      flex-direction: column; gap: 4px; padding: 4px;
    }
    .topbar__hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
    .topbar__title { font-size: 16px; font-weight: 600; }
    .topbar__right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .topbar__avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue); display: flex; align-items: center;
      justify-content: center; font-size: 13px; font-weight: 700;
      color: #fff; cursor: pointer;
    }

    /* ============================================================
       CONTENT
    ============================================================ */
    .content { padding: 28px; flex: 1; }

    /* Page header */
    .page-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 16px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .page-header__title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .page-header__sub   { font-size: 13px; color: var(--muted); margin-top: 3px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      border-radius: 8px; font-size: 13px; font-weight: 500;
      padding: 9px 18px; border: none; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn--primary { background: var(--blue); color: #fff; }
    .btn--primary:hover { background: var(--blue-dk); }
    .btn--outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
    .btn--outline:hover { border-color: var(--blue); color: var(--blue); }

    /* ============================================================
       CARD
    ============================================================ */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ============================================================
       MODAL
    ============================================================ */
    .modal-overlay {
      display: none; position: fixed;
      top: 0; right: 0; bottom: 0; left: var(--sidebar-w);
      background: rgba(0,0,0,0.55); z-index: 500;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; width: 100%;
      max-width: 460px; max-height: 90vh; overflow-y: auto;
      transform-origin: center 85%; will-change: clip-path, transform;
    }
    @media (max-width: 768px) { .modal-overlay { left: 0; } }
    .modal.genie-in  { animation: genieIn  0.54s cubic-bezier(0.34,1.1,0.64,1) both; }
    .modal.genie-out { animation: genieOut 0.36s cubic-bezier(0.4,0,0.8,1)     both; }
    @keyframes genieIn {
      0%  { opacity:.7; clip-path:polygon(48% 100%,52% 100%,52% 100%,48% 100%,48% 100%,52% 100%); transform:scaleY(0.02); }
      18% { opacity:1;  clip-path:polygon(0% 0%,100% 0%,74% 50%,62% 100%,38% 100%,26% 50%);        transform:scaleY(0.58); }
      50% {             clip-path:polygon(0% 0%,100% 0%,90% 50%,82% 100%,18% 100%,10% 50%);        transform:scaleY(0.84); }
      78% {             clip-path:polygon(0% 0%,100% 0%,98% 50%,94% 100%,6%  100%,2%  50%);        transform:scaleY(0.97); }
      100%{ opacity:1;  clip-path:polygon(0% 0%,100% 0%,100% 50%,100% 100%,0% 100%,0% 50%);        transform:scaleY(1);    }
    }
    @keyframes genieOut {
      0%  { opacity:1;  clip-path:polygon(0% 0%,100% 0%,100% 50%,100% 100%,0% 100%,0% 50%);        transform:scaleY(1);    }
      20% {             clip-path:polygon(0% 0%,100% 0%,98% 50%,94% 100%,6%  100%,2%  50%);        transform:scaleY(0.97); }
      50% { opacity:1;  clip-path:polygon(0% 0%,100% 0%,90% 50%,82% 100%,18% 100%,10% 50%);        transform:scaleY(0.84); }
      80% { opacity:.8; clip-path:polygon(0% 0%,100% 0%,74% 50%,62% 100%,38% 100%,26% 50%);        transform:scaleY(0.56); }
      100%{ opacity:0;  clip-path:polygon(48% 100%,52% 100%,52% 100%,48% 100%,48% 100%,52% 100%); transform:scaleY(0.02); }
    }
    .modal__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--border);
    }
    .modal__title { font-size: 16px; font-weight: 700; }
    .modal__close { background: none; border: none; color: var(--muted); padding: 4px; }
    .modal__close:hover { color: var(--text); }
    .modal__close svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* ============================================================
       MOBILE
    ============================================================ */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .topbar__hamburger { display: flex; }
      .content { padding: 16px; }
    }

    /* ============================================================
       DARK MODE
    ============================================================ */
    body.dark {
      --bg:       #0f1117;
      --white:    #1a1d27;
      --text:     #e8eaf0;
      --muted:    #8b90a0;
      --border:   #2a2d3a;
      --blue-lt:  #1a2444;
      --green-lt: #0d2b1e;
    }
    body.dark .sidebar             { background: #080b13; }
    body.dark .topbar,
    body.dark .card,
    body.dark .modal               { background: #1a1d27; }
    body.dark tbody tr:hover        { background: #0f1117; }
    body.dark .topbar__icon-btn    { background: #0f1117; }
    body.dark .data-table tbody tr:hover { background: #0f1117; }

    /* ── Custom scrollbars ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    body.dark ::-webkit-scrollbar-thumb { background: #2a2d3a; }
    body.dark ::-webkit-scrollbar-thumb:hover { background: #3a3e52; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* Dark toggle */
    .dark-toggle {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--bg); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .dark-toggle:hover { border-color: var(--blue); }
    .dark-toggle svg { width: 16px; height: 16px; fill: none; stroke: var(--text); stroke-width: 2; }

    /* ============================================================
       HISTORY-SPECIFIC
    ============================================================ */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover { background: var(--bg); }
    body { visibility: hidden; }
  </style>

<script>
  // Apply dark mode immediately before render
  if (localStorage.getItem('xantex-theme') !== 'light') {
    document.body.classList.add('dark');
    const _di = document.getElementById('dark-icon'); if (_di) _di.innerHTML = '<circle cx=\"12\" cy=\"12\" r=\"5\"/><line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"3\"/><line x1=\"12\" y1=\"21\" x2=\"12\" y2=\"23\"/><line x1=\"4.22\" y1=\"4.22\" x2=\"5.64\" y2=\"5.64\"/><line x1=\"18.36\" y1=\"18.36\" x2=\"19.78\" y2=\"19.78\"/><line x1=\"1\" y1=\"12\" x2=\"3\" y2=\"12\"/><line x1=\"21\" y1=\"12\" x2=\"23\" y2=\"12\"/><line x1=\"4.22\" y1=\"19.78\" x2=\"5.64\" y2=\"18.36\"/><line x1=\"18.36\" y1=\"5.64\" x2=\"19.78\" y2=\"4.22\"/>';
  }

  async function signOut() {
    await window.XANTEX_DB.auth.signOut();
    window.location.href = 'login.html';
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  function toggleDark() {
    const isDark = document.body.classList.toggle('dark');
    const sunIcon = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
    document.getElementById('dark-icon').innerHTML = isDark ? sunIcon : moonIcon;
    localStorage.setItem('xantex-theme', isDark ? 'dark' : 'light');
  }

  if (document.body.classList.contains('dark')) {
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('dark-icon');
      if (el) el.innerHTML = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
    });
  }

  (async () => {
    const db = window.XANTEX_DB;
    if (!db) return;
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    document.body.style.visibility = 'visible';
    const userId = session.user.id;
    initNotifPopup(db, userId);

    const { data: profile } = await db.from('profiles').select('first_name,last_name,email,kyc_status,avatar_url,phone,country,city,date_of_birth,nationality').eq('id', userId).single();
    if (profile) {
      const init = ((profile.first_name||'')[0]||(profile.last_name||'')[0]||'?').toUpperCase() + ((profile.last_name||'')[0]||'').toUpperCase();
      const name = `${profile.first_name||''} ${profile.last_name||''}`.trim() || session.user.email;
      document.querySelectorAll('.sidebar__avatar,.topbar__avatar').forEach(el => el.textContent = init);
      document.querySelectorAll('.sidebar__user-name').forEach(el => el.textContent = name);
      if (profile.avatar_url) {
        document.querySelectorAll('.sidebar__avatar,.topbar__avatar').forEach(el => {
          el.innerHTML = `<img src="${profile.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        });
      }
    }

    // History-specific code
    const _HIST_STATUS = {
      pending:    { bg:'rgba(245,166,35,0.12)',  color:'#f5a623', label:'Pending'    },
      processing: { bg:'rgba(26,92,255,0.12)',   color:'#1a5cff', label:'Processing' },
      completed:  { bg:'rgba(34,160,107,0.12)',  color:'#22a06b', label:'Completed'  },
      approved:   { bg:'rgba(34,160,107,0.12)',  color:'#22a06b', label:'Approved'   },
      rejected:   { bg:'rgba(230,0,35,0.12)',    color:'#e60023', label:'Rejected'   },
      cancelled:  { bg:'rgba(156,163,175,0.12)', color:'#9ca3af', label:'Cancelled'  },
    };
    function _fmtDate(d) { return d ? new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }
    function _fmtDateLong(d) { return d ? new Date(d).toLocaleString('en-US',{dateStyle:'long',timeStyle:'short'}) : '—'; }

    const [txnsRes, depRes, wdRes] = await Promise.allSettled([
      db.from('transactions').select('*').eq('user_id', userId).in('type',['deposit','withdrawal']).order('created_at',{ascending:false}),
      db.from('deposit_requests').select('*').eq('user_id', userId).order('created_at',{ascending:false}),
      db.from('withdrawal_requests').select('*').eq('user_id', userId).order('created_at',{ascending:false}),
    ]);
    const txns    = txnsRes.value?.data    || [];
    const depReqs = depRes.value?.data     || [];
    const wdReqs  = wdRes.value?.data      || [];

    const rows = [
      ...txns.filter(t => t.type==='deposit'||t.type==='withdrawal').map(t => ({
        id:t.id, date:t.created_at, label: t.type==='deposit'?'Deposit':'Withdrawal',
        amount: t.type==='withdrawal' ? -Math.abs(parseFloat(t.amount||0)) : parseFloat(t.amount||0), status: t.status||'completed', canCancel: false,
        detail: { 'Description': (t.description||'—').replace('Deposit approved by admin','Xantex approved your deposit').replace('Withdrawal approved by admin','Xantex approved your withdrawal'), 'Reference': t.reference?t.reference.slice(0,8).toUpperCase():'—', 'Date': _fmtDateLong(t.created_at) },
      })),
      ...depReqs.filter(d=>d.status!=='approved').map(d => ({
        id:d.id, date:d.created_at, label:'Deposit Request',
        amount: parseFloat(d.amount||0), status: d.status||'pending', canCancel: d.status==='pending',
        detail: { 'Amount':'$'+parseFloat(d.amount||0).toFixed(2), 'Method':d.payment_method||d.method||'—', 'Reference':d.id.slice(0,8).toUpperCase(), 'Submitted':_fmtDateLong(d.created_at) },
      })),
      ...wdReqs.filter(w=>w.status!=='approved').map(w => {
        const isCrypto=(w.destination_type||'').toLowerCase().includes('crypto');
        const detail = isCrypto
          ? { 'Amount':'$'+Math.abs(parseFloat(w.amount||0)).toFixed(2),'Method':'Cryptocurrency','Coin':w.destination_name||'—','Wallet Address':w.destination_ref||'—','Reference':w.id.slice(0,8).toUpperCase(),'Submitted':_fmtDateLong(w.created_at) }
          : { 'Amount':'$'+Math.abs(parseFloat(w.amount||0)).toFixed(2),'Method':'Bank Transfer','Bank Name':(w.destination_ref||'').split(' | ')[0]||'—','Account Name':w.destination_name||'—','Account Number / IBAN':(w.destination_ref||'').split(' | ')[1]||'—','Reference':w.id.slice(0,8).toUpperCase(),'Submitted':_fmtDateLong(w.created_at) };
        return { id:w.id, date:w.created_at, label:'Withdrawal Request', amount:-Math.abs(parseFloat(w.amount||0)), status:w.status||'pending', canCancel:w.status==='pending', detail };
      }),
    ].sort((a,b) => new Date(b.date)-new Date(a.date));

    window._txnRows = rows;
    const tbody = document.getElementById('history-tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--muted);">No transactions yet</td></tr>';
    } else {
      tbody.innerHTML = rows.map((r,i) => {
        const ss=_HIST_STATUS[r.status]||_HIST_STATUS.pending;
        const pos=r.amount>=0;
        const absA=Math.abs(r.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
        const cancelBtn=r.canCancel?`<button onclick="_cancelTxn(${i})" style="margin-left:6px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(230,0,35,0.08);color:var(--red);border:1px solid rgba(230,0,35,0.18);cursor:pointer;">Cancel</button>`:'';
        return `<tr>
          <td><div style="font-size:10px;color:var(--muted);margin-bottom:3px;">${_fmtDate(r.date)}</div><div style="font-weight:700;font-size:13px;">${r.label}</div></td>
          <td style="font-weight:700;color:${pos?'var(--green)':'var(--red)'};">${pos?'+':'-'}$${absA}</td>
          <td><span style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:${ss.bg};color:${ss.color};">${ss.label}</span></td>
          <td><button onclick="_openTxnDetail(${i})" style="padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(26,92,255,0.08);color:var(--blue);border:1px solid rgba(26,92,255,0.18);cursor:pointer;">View Details</button>${cancelBtn}</td>
        </tr>`;
      }).join('');
    }

    window._openTxnDetail = function(i) {
      const r=(window._txnRows||[])[i]; if(!r) return;
      const ss=_HIST_STATUS[r.status]||_HIST_STATUS.pending;
      const pos=r.amount>=0; const absA=Math.abs(r.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      document.getElementById('txn-detail-title').textContent=r.label+' Details';
      document.getElementById('txn-detail-body').innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 16px;border-bottom:1px solid var(--border);">
          <span style="font-size:30px;font-weight:800;color:${pos?'var(--green)':'var(--red)'};">${pos?'+':'-'}$${absA}</span>
          <span style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;background:${ss.bg};color:${ss.color};">${ss.label}</span>
        </div>
        <div style="padding:0 24px 20px;">${Object.entries(r.detail).filter(([,v])=>v&&v!=='—').map(([k,v])=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border);"><span style="font-size:12px;color:var(--muted);flex-shrink:0;margin-right:16px;">${k}</span><span style="font-size:13px;font-weight:600;text-align:right;word-break:break-all;">${String(v).replace(/</g,'&lt;')}</span></div>`).join('')}</div>`;
      openModal('modal-txn-detail');
    };

    window._cancelTxn = async function(i) {
      const r=(window._txnRows||[])[i]; if(!r||!r.canCancel) return;
      if(!confirm('Cancel this request? This cannot be undone.')) return;
      const isWithdrawal = !r.label.includes('Deposit');
      const table = isWithdrawal ? 'withdrawal_requests' : 'deposit_requests';
      const {error}=await db.from(table).update({status:'cancelled'}).eq('id',r.id).eq('status','pending');
      if(error){alert('Could not cancel: '+error.message);return;}
      // Refund held balance for withdrawal cancellation
      if (isWithdrawal) {
        const refundAmt = Math.abs(r.amount);
        const { data: prof } = await db.from('profiles').select('balance').eq('id', userId).single();
        await db.from('profiles').update({ balance: (prof?.balance ?? 0) + refundAmt }).eq('id', userId);
      }
      location.reload();
    };

    function openModal(id) {
      const overlay = document.getElementById(id);
      const m = overlay.querySelector('.modal');
      m.classList.remove('genie-out');
      overlay.classList.add('open');
      void m.offsetWidth;
      m.classList.add('genie-in');
      m.addEventListener('animationend', () => m.classList.remove('genie-in'), { once: true });
    }
    function closeModal(id) {
      const overlay = document.getElementById(id);
      const m = overlay.querySelector('.modal');
      m.classList.remove('genie-in');
      m.classList.add('genie-out');
      m.addEventListener('animationend', () => {
        m.classList.remove('genie-out');
        overlay.classList.remove('open');
      }, { once: true });
    }
    window.openModal  = openModal;
    window.closeModal = closeModal;
    document.getElementById('modal-txn-detail').addEventListener('click', e => {
      if(e.target===e.currentTarget) closeModal('modal-txn-detail');
    });
    document.addEventListener('keydown', e => { if(e.key==='Escape') document.querySelectorAll('.modal-overlay.open').forEach(el => closeModal(el.id)); });
  })();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
</html>
