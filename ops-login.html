<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Admin Login — Xantex OPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest-ops.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Xantex OPS">
  <link rel="apple-touch-icon" href="/images/admin-icon-192.png">
  <meta name="theme-color" content="#7f1d1d">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { --blue:#1a5cff; --red:#e60023; }
    html, body {
      overflow-x:clip; height:100%; font-family:'Inter',sans-serif;
      background:#0d1120; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<div style="background:#1a1d27;border:1px solid #2a2d3a;border-radius:14px;padding:40px;width:100%;max-width:380px;text-align:center;">
  <div style="font-size:11px;font-weight:800;letter-spacing:0.12em;background:var(--red);color:#fff;padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:16px;">OPS ADMIN</div>
  <div style="font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;">Xantex Control Panel</div>
  <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:28px;">Restricted access — authorised personnel only</div>
  <div style="display:flex;flex-direction:column;gap:12px;text-align:left;">
    <div style="display:flex;flex-direction:column;gap:4px;">
      <label style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.07em;">Admin Email</label>
      <input id="admin-user" type="email" placeholder="admin@yourdomain.com"
        style="height:42px;background:#0f1117;border:1.5px solid #2a2d3a;border-radius:8px;padding:0 14px;font-size:14px;color:#fff;outline:none;font-family:inherit;"
        onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='#2a2d3a'">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <label style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.07em;">Password</label>
      <input id="admin-pass" type="password" placeholder="••••••••"
        style="height:42px;background:#0f1117;border:1.5px solid #2a2d3a;border-radius:8px;padding:0 14px;font-size:14px;color:#fff;outline:none;font-family:inherit;"
        onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='#2a2d3a'"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="font-size:12px;color:var(--red);display:none;"></div>
    <button id="btn-login" onclick="doLogin()"
      style="height:44px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;">
      <span id="btn-label">Sign In to OPS</span>
      <div id="btn-spin" style="display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;"></div>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script>
  const db     = window.XANTEX_DB;
  const errEl  = document.getElementById('login-err');
  const btn    = document.getElementById('btn-login');
  const label  = document.getElementById('btn-label');
  const spin   = document.getElementById('btn-spin');

  function setLoading(on) {
    btn.disabled = on;
    label.style.display = on ? 'none' : '';
    spin.style.display  = on ? 'block' : 'none';
  }
  function showErr(msg) { errEl.style.display = 'block'; errEl.textContent = msg; setLoading(false); }

  async function doLogin() {
    errEl.style.display = 'none';
    const email = document.getElementById('admin-user').value.trim();
    const pass  = document.getElementById('admin-pass').value;
    if (!email || !pass) { showErr('Please enter your email and password.'); return; }
    if (!db) { showErr('Database not initialised — please refresh.'); return; }
    setLoading(true);
    try { await db.auth.signOut(); } catch(e) {}
    const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
    if (error) { showErr('Auth error: ' + error.message); return; }
    if (!data?.user) { showErr('No user returned — try again.'); return; }
    const { data: adminRow, error: adminErr } = await db
      .from('admin_users').select('id,email,role').eq('id', data.user.id).maybeSingle();
    if (adminErr) { showErr('Admin lookup error: ' + adminErr.message); return; }
    if (!adminRow) { await db.auth.signOut(); showErr('Access denied — not an admin account.'); return; }
    window.location.href = 'ops.html';
  }

  // If already logged in as admin, skip straight to ops
  (async () => {
    if (!db) return;
    try {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return;
      const { data: adminRow } = await db
        .from('admin_users').select('id').eq('id', session.user.id).maybeSingle();
      if (adminRow) window.location.href = 'ops.html';
    } catch(e) {}
  })();
</script>
<script src="/pwa-install-ops.js"></script>
</body>
</html>
