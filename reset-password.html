<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Reset Password — Xantex Global Markets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #e60023;
      --blue:   #1a5cff;
      --blue-dk:#1244cc;
      --bg:     #f4f6f9;
      --white:  #ffffff;
      --text:   #111111;
      --muted:  #666666;
      --border: #e0e3e8;
      --green:  #22a06b;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); font-size:15px; min-height:100vh; }
    img  { display:block; max-width:100%; }
    a    { text-decoration:none; color:inherit; }
    button { font-family:inherit; cursor:pointer; }

    .navbar {
      background:#fff; border-bottom:1px solid var(--border);
      height:64px; display:flex; align-items:center; padding:0 clamp(16px,4vw,60px);
      position:sticky; top:0; z-index:100;
    }
    .navbar__inner { width:100%; max-width:1240px; margin:0 auto; display:flex; align-items:center; }
    .navbar__logo img  { height:130px; }
    .navbar__logo-text { font-size:24px; font-weight:700; color:var(--red); display:none; }

    .page {
      min-height:calc(100vh - 64px);
      display:flex; align-items:center; justify-content:center;
      padding:40px 20px;
    }

    /* Loading overlay */
    .loading-overlay {
      position:fixed; inset:0; background:var(--bg);
      display:flex; align-items:center; justify-content:center; z-index:50;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner-lg {
      width:40px; height:40px; border:3px solid var(--border);
      border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite;
    }

    .card {
      background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:40px 44px; width:100%; max-width:440px;
      box-shadow:0 4px 24px rgba(0,0,0,0.06); display:none;
    }

    .card__icon {
      width:52px; height:52px; border-radius:14px;
      background:var(--blue); display:flex; align-items:center; justify-content:center;
      margin-bottom:20px;
    }
    .card__icon svg { width:24px; height:24px; fill:none; stroke:#fff; stroke-width:2; }
    .card__icon.success { background:var(--green); }

    .card__title { font-size:22px; font-weight:700; letter-spacing:-0.3px; margin-bottom:6px; }
    .card__sub   { font-size:13px; color:var(--muted); margin-bottom:28px; line-height:1.6; }

    .field { display:flex; flex-direction:column; gap:5px; margin-bottom:16px; }
    .field label { font-size:13px; font-weight:500; }
    .field__wrap { position:relative; }
    .field input {
      width:100%; height:48px; border:1.5px solid var(--border); border-radius:8px;
      padding:0 44px 0 14px; font-size:14px; font-family:inherit; color:var(--text);
      background:#fff; outline:none; transition:border-color .15s, box-shadow .15s;
    }
    .field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(26,92,255,.1); }
    .field input.error { border-color:var(--red); }
    .pw-toggle {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      background:none; border:none; padding:0; color:var(--muted);
      display:flex; align-items:center; cursor:pointer;
    }
    .pw-toggle svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; }

    .pw-rules { font-size:12px; color:var(--muted); margin-top:4px; }

    .alert {
      display:none; padding:12px 14px; border-radius:8px;
      font-size:13px; gap:10px; align-items:flex-start; margin-bottom:16px;
    }
    .alert.error   { background:#fff0f0; border:1px solid #fbc5c5; color:#a32d2d; display:flex; }
    .alert.success { background:#e6f7ef; border:1px solid #b3e8d0; color:#1a6644; display:flex; }
    .alert svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; flex-shrink:0; margin-top:1px; }

    .btn-submit {
      width:100%; height:50px; background:var(--blue); color:#fff;
      border:none; border-radius:28px; font-size:15px; font-weight:600;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:background .15s; margin-top:4px;
    }
    .btn-submit:hover { background:var(--blue-dk); }
    .btn-submit:disabled { opacity:0.65; pointer-events:none; }
    .spinner {
      width:18px; height:18px; border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none;
    }
    .btn-submit.loading .btn-label { display:none; }
    .btn-submit.loading .spinner   { display:block; }

    .error-card {
      background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:40px 44px; width:100%; max-width:440px;
      text-align:center; display:none; box-shadow:0 4px 24px rgba(0,0,0,0.06);
    }
    .error-card__icon { font-size:48px; margin-bottom:16px; }
    .error-card__title { font-size:20px; font-weight:700; margin-bottom:8px; }
    .error-card__sub   { font-size:13px; color:var(--muted); margin-bottom:24px; line-height:1.6; }
    .btn-outline {
      display:inline-flex; align-items:center; justify-content:center;
      height:44px; padding:0 24px; border:1.5px solid var(--border);
      border-radius:8px; font-size:14px; font-weight:500; color:var(--text);
      background:#fff; cursor:pointer; transition:border-color .15s;
    }
    .btn-outline:hover { border-color:var(--blue); color:var(--blue); }

    @media (max-width:480px) { .card, .error-card { padding:32px 24px; } }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <meta name="theme-color" content="#1a5cff">
</head>
<body>

<nav class="navbar">
  <div class="navbar__inner">
    <div class="navbar__logo">
      <a href="/index.html">
        <img src="/images/logo.png" alt="Xantex"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="navbar__logo-text">Xantex</span>
      </a>
    </div>
  </div>
</nav>

<!-- Loading spinner while we verify the reset token -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner-lg"></div>
</div>

<div class="page">

  <!-- Invalid / expired link -->
  <div class="error-card" id="error-card">
    <div class="error-card__icon">🔗</div>
    <div class="error-card__title">Link expired or invalid</div>
    <div class="error-card__sub">This password reset link has expired or has already been used. Please request a new one.</div>
    <a href="forgot-password.html" class="btn-outline">Request a new link</a>
  </div>

  <!-- New password form -->
  <div class="card" id="reset-card">

    <div class="card__icon" id="card-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>

    <div class="card__title" id="card-title">Set a new password</div>
    <div class="card__sub" id="card-sub">Choose a strong password for your Xantex account.</div>

    <div class="alert" id="alert">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="alert-msg"></span>
    </div>

    <div id="form-wrap">
      <div class="field">
        <label for="password">New Password</label>
        <div class="field__wrap">
          <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password">
          <button class="pw-toggle" type="button" onclick="togglePw('password',this)">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pw-rules">At least 8 characters</div>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <div class="field__wrap">
          <input type="password" id="confirm" placeholder="Re-enter your password" autocomplete="new-password">
          <button class="pw-toggle" type="button" onclick="togglePw('confirm',this)">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-submit" id="btn-save" onclick="savePassword()">
        <span class="btn-label">Update Password</span>
        <div class="spinner"></div>
      </button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script>
(async () => {
  const db = window.XANTEX_DB;
  const loadingEl = document.getElementById('loading-overlay');
  const resetCard = document.getElementById('reset-card');
  const errorCard = document.getElementById('error-card');

  function showError() {
    loadingEl.style.display = 'none';
    errorCard.style.display = 'block';
  }

  if (!db) { showError(); return; }

  // Supabase password reset links arrive as:
  //   ?token_hash=...&type=recovery   (OTP flow)
  //   ?code=...                        (PKCE flow)
  //   #access_token=...&type=recovery  (implicit flow — handled by getSession)
  const sp   = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.slice(1));
  const tokenHash = sp.get('token_hash');
  const code      = sp.get('code');
  const hashType  = hash.get('type');

  let session = null;

  if (tokenHash) {
    try {
      const { data } = await db.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
      session = data?.session;
    } catch(e) {}
    try { window.history.replaceState({}, '', window.location.pathname); } catch(e) {}
  }

  if (!session && code) {
    try {
      const { data } = await db.auth.exchangeCodeForSession(code);
      session = data?.session;
    } catch(e) {}
    try { window.history.replaceState({}, '', window.location.pathname); } catch(e) {}
  }

  if (!session && hashType === 'recovery') {
    try {
      const { data } = await db.auth.getSession();
      session = data?.session;
    } catch(e) {}
    try { window.history.replaceState({}, '', window.location.pathname); } catch(e) {}
  }

  // Wait for SIGNED_IN event if nothing resolved yet (async exchange still in flight)
  if (!session) {
    session = await new Promise(resolve => {
      let resolved = false;
      const t = setTimeout(() => { if (!resolved) { resolved = true; resolve(null); } }, 6000);
      const { data: { subscription } } = db.auth.onAuthStateChange((event, s) => {
        if (!resolved && event === 'SIGNED_IN' && s) {
          resolved = true; clearTimeout(t);
          resolve(s);
          setTimeout(() => subscription.unsubscribe(), 0);
        }
      });
    });
  }

  if (!session) { showError(); return; }

  loadingEl.style.display = 'none';
  resetCard.style.display = 'block';
})();

function togglePw(id, btn) {
  const input = document.getElementById(id);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.querySelector('svg').innerHTML = isText
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
}

async function savePassword() {
  const pwEl   = document.getElementById('password');
  const cfEl   = document.getElementById('confirm');
  const btn    = document.getElementById('btn-save');
  const alertEl = document.getElementById('alert');
  const db     = window.XANTEX_DB;

  alertEl.className = 'alert';
  pwEl.classList.remove('error');
  cfEl.classList.remove('error');

  const pw = pwEl.value;
  const cf = cfEl.value;

  if (pw.length < 8) {
    pwEl.classList.add('error');
    alertEl.className = 'alert error';
    document.getElementById('alert-msg').textContent = 'Password must be at least 8 characters.';
    return;
  }
  if (pw !== cf) {
    cfEl.classList.add('error');
    alertEl.className = 'alert error';
    document.getElementById('alert-msg').textContent = 'Passwords do not match.';
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  const { error } = await db.auth.updateUser({ password: pw });

  btn.classList.remove('loading');
  btn.disabled = false;

  if (error) {
    alertEl.className = 'alert error';
    document.getElementById('alert-msg').textContent = error.message || 'Failed to update password. Please try again.';
    return;
  }

  // Success — show confirmation then redirect
  document.getElementById('form-wrap').style.display = 'none';
  document.getElementById('card-icon').innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  document.getElementById('card-icon').className = 'card__icon success';
  document.getElementById('card-title').textContent = 'Password updated!';
  document.getElementById('card-sub').textContent = 'Your password has been changed successfully. Redirecting you to login…';

  await db.auth.signOut();
  setTimeout(() => { window.location.href = 'login.html'; }, 2500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') savePassword();
});
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
</html>
